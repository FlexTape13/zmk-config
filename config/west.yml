manifest:
  defaults:
    revision: v0.3
  remotes:
  - name: zmkfirmware
    url-base: https://github.com/zmkfirmware
    # Additional modules containing boards/shields/custom code can be listed here as well
    # See https://docs.zephyrproject.org/3.2.0/develop/west/manifest.html#projects
  - name: FlexTape13
    url-base: https://github.com/FlexTape13
  projects:
  - name: zmk
    remote: zmkfirmware
    import: app/west.yml

  - name: zmk-config
    remote: FlexTape13
    revision: main
  - name: zmk-keyboards-splitminivan
    url: https://github.com/FlexTape13/zmk-keyboards-splitminivan
    revision: main
    path: modules/zmk-keyboards-splitminivan
  self:
    path: config
